[workspace]
resolver = "2"
members = ["crates/hs-core", "crates/hs-app", "crates/hs-cli"]
default-members = ["crates/hs-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Harpsistudio contributors"]
license = "MIT"
repository = "https://github.com/ash3rrrr/harpsistudio"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
