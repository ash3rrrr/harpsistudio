[package]
name = "hs-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Rust desktop beat workstation GUI for Harpsistudio"
keywords = ["audio", "music", "daw", "gui", "workstation"]
categories = ["multimedia::audio", "gui"]

[[bin]]
name = "harpsistudio"
path = "src/main.rs"

[dependencies]
hs-core = { path = "../hs-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.37"
cpal = "0.18"
midir = "0.11"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27.0"
