name: Feature request
description: Propose a focused capability for the workstation, CLI, or renderer.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Harpsistudio is deliberately small and Windows-first. Explain the production or contribution problem first so the proposal can be judged on the workflow, not only the implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the musical or workflow need, and what you do today instead.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Harpsistudio do? Include the user-facing workflow if it changes the UI.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing devices, shortcuts, or external tools you tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app / workflow
        - Audio engine or DSP
        - Instruments, effects, or MIDI generators
        - Sample library or factory content
        - Project file or rendering
        - Headless CLI
        - Build, CI, or documentation
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Expected scope
      description: Which parts of the repo would this touch? Note any project-file, audio-license, or compatibility impact.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to implement it?
      options:
        - Yes, I can open a pull request
        - Yes, with guidance
        - No, I am proposing the idea only
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not already covered.
          required: true
        - label: I read the current limitations in README.md and the contributor guide.
          required: true
